services:
  - type: web
    name: keycloak
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        sync: false # e.g. jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
      - key: KC_DB_USERNAME
        sync: false # e.g. postgres (or postgres.<project-ref> if pooler)
      - key: KC_DB_PASSWORD
        sync: false # Supabase database password
      - key: KC_DB_SCHEMA
        value: keycloak # Keeps Keycloak tables isolated from Backstage tables in Supabase
      - key: KC_HTTP_ENABLED
        value: "true"
      - key: KC_PROXY_HEADERS
        value: "xforwarded"
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        generateValue: true
